name: CI/CD & Vercel Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Frontend Quality Gate (TypeScript & Next.js Build)
  ci-frontend:
    name: Frontend CI (Lint, Typecheck & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check (tsc)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Next.js Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:5000/api/v1' }}
        run: npm run build

  # 2. Backend Quality Gate (TypeScript & Prisma Generate)
  ci-backend:
    name: Backend CI (Prisma & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Type Check (tsc)
        working-directory: backend
        run: npx tsc --noEmit

  # 3. Automated Vercel Deployment
  deploy-vercel:
    name: Deploy to Vercel
    needs: [ci-frontend, ci-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        if: "${{ secrets.VERCEL_TOKEN != '' }}"
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: frontend

      - name: Vercel Native Git Integration Notification
        if: "${{ secrets.VERCEL_TOKEN == '' }}"
        run: |
          echo "=========================================================================="
          echo "CI Checks passed successfully!"
          echo "If you have connected this repo to Vercel via Vercel Dashboard,"
          echo "Vercel's native Git Integration will automatically deploy this commit."
          echo ""
          echo "To enable direct GitHub Actions deployment to Vercel, configure:"
          echo "  - VERCEL_TOKEN"
          echo "  - VERCEL_ORG_ID"
          echo "  - VERCEL_PROJECT_ID"
          echo "in your GitHub Repository Settings > Secrets and variables > Actions."
          echo "=========================================================================="
